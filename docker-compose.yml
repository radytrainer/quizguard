name: quizguard

services:
  postgres:
    image: postgres:16-alpine
    container_name: quizguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizguard_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-quizguard}
    ports:
      # 55432, not 5432: dev machines commonly run one or more native PostgreSQL services
      # (this one had five, versions 14-18, occupying 5432-5436) and Docker Desktop's WSL2
      # port-forwarding will silently route to one of those instead of this container.
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - quizguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-quizguard} -d ${POSTGRES_DB:-quizguard}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: quizguard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - quizguard_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted sandboxed code runner for code_answer questions (Phase 16) — never exposed to
  # the browser, only ever called server-side from src/backend/execution/. `privileged: true` is
  # Piston's own documented requirement for its sandboxing (isolate/nsjail + cgroups); published
  # here (dev only — docker-compose.prod.yml deliberately does not) purely for convenience
  # curling it directly while developing. Once healthy, install the python/node runtimes with
  # `pnpm piston:install` (scripts/piston-install-packages.ts) before the app can actually
  # execute anything — packages persist across restarts via the named volume below.
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: quizguard-piston
    restart: unless-stopped
    privileged: true
    environment:
      # Piston's own default run_timeout ceiling is 3000ms — below what
      # src/backend/execution/execution.service.ts requests for grading (GRADE_TIMEOUT_MS,
      # 8000ms), which the server rejects outright with a 400 rather than clamping. Raised here
      # with headroom above the app's own highest requested run_timeout.
      PISTON_RUN_TIMEOUT: "10000"
    ports:
      - "${PISTON_PORT:-2000}:2000"
    volumes:
      - quizguard_piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec
    healthcheck:
      # No curl/wget in this image — it's Node-based, so the healthcheck uses Node's own http
      # module instead (same reasoning as postgres/redis using their own native CLI tools above).
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:2000/api/v2/runtimes',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  quizguard_postgres_data:
  quizguard_redis_data:
  quizguard_piston_packages:
