worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Phase 11's deferred body-size-limit item (docs/ARCHITECTURE.md — Section 14/20): Next.js
  # Route Handlers have no `next.config.ts`-level option that actually rejects an oversized
  # request (the framework's own `proxyClientMaxBodySize` only caps in-memory buffering and
  # silently truncates rather than erroring — confirmed against
  # node_modules/next/dist/docs/01-app/03-api-reference/05-config/01-next-config-js
  # /proxyClientMaxBodySize.md). Nginx's client_max_body_size is the mechanism that actually
  # returns 413 outright. Sized with headroom over MAX_IMPORT_FILE_BYTES (5MB,
  # src/backend/imports/parse-limits.ts) for multipart form-data overhead.
  client_max_body_size 10m;

  upstream app {
    server app:3000;
  }

  upstream realtime {
    server realtime:4001;
  }

  server {
    listen 80;
    server_name _;
    # Everything redirects to HTTPS — no plaintext app traffic in production.
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Socket.IO's default path — routed to the realtime service specifically so the browser
    # reaches it same-origin (see src/features/realtime/socket-client.ts and src/proxy.ts's
    # connect-src, Section 16). Everything else falls through to the Next.js app below.
    location /socket.io/ {
      proxy_pass http://realtime;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # $http_host, not $host: nginx's $host strips the port from the Host header, which is
      # fine on the standard 80/443 ports this is normally deployed on, but silently breaks
      # isSameOrigin() (src/lib/same-origin.ts) on any non-standard port — the browser's Origin
      # header keeps the port (e.g. "localhost:8443") while a port-stripped forwarded Host
      # ("localhost") never matches it, rejecting every state-changing request as cross-origin.
      # $http_host preserves the Host header exactly as the client sent it.
      proxy_set_header Host $http_host;
      # Overwritten, not appended (no $proxy_add_x_forwarded_for): the app's rate limiter
      # (src/lib/rate-limit.ts callers) trusts the *first* X-Forwarded-For entry as the real
      # client IP. Appending to whatever a client sent would let them prepend a spoofed IP
      # ahead of Nginx's own — setting it outright is what makes that header trustworthy at all.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      # $http_host, not $host — same reasoning as the /socket.io/ block above.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
